<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Al Jabr Concert Photobooth</title>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #153e5e;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  font-size: 25px;
  padding: 0 10px;
}

/* CAMERA PREVIEW */

#cameraStage {
  position: relative;
  width: 90%;
  max-width: 850px;
  aspect-ratio: 3 / 2;
  margin: 20px auto;
  overflow: hidden;
  border-radius: 12px;
  background: #000;
}

#video {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  object-fit: cover;
  transform: scaleX(-1);
}

#frameOverlay {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
  object-fit: fill;
  pointer-events: none;
  z-index: 2;
}

/* BUTTONS */

button {
  padding: 15px 25px;
  margin: 10px;
  border: none;
  border-radius: 10px;
  background: #e8a323;
  color: #153e5e;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* RESULT */

#canvas {
  display: none;
}

#result {
  display: none;
}

#photo {
  width: 90%;
  max-width: 850px;
  border-radius: 10px;
}

#qr {
  background: white;
  padding: 12px;
  width: 200px;
  margin: 20px auto;
}

#status {
  padding: 12px;
}

@media (max-width: 600px) {
  h1 {
    font-size: 20px;
  }

  #cameraStage {
    width: 96%;
  }

  button {
    font-size: 14px;
    padding: 12px 18px;
  }
}
</style>
</head>

<body>

<h1>AL JABR CONCERT PHOTOBOOTH</h1>

<div id="cameraArea">

  <div id="cameraStage">

    <!-- CAMERA LAYER -->
    <video id="video" autoplay playsinline muted></video>

    <!-- FRAME OVERLAY -->
    <img id="frameOverlay"
         src="background.png"
         alt="Concert Frame">

  </div>

  <button id="start">START CAMERA</button>
  <button id="capture" disabled>TAKE PHOTO</button>

</div>

<canvas id="canvas"></canvas>

<div id="result">

  <img id="photo">

  <h2>Your photo is ready!</h2>

  <div id="qr"></div>

  <p>Scan to download your photo</p>

  <a id="download" target="_blank">
    Download Photo
  </a>

  <br>

  <button id="next">NEXT GUEST</button>

</div>

<p id="status">Welcome to our concert!</p>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const background = document.getElementById("frameOverlay");

let stream;
let photoData = "";
let isCapturing = false;

// START CAMERA

document.getElementById("start").onclick = async () => {

  try {

    document.getElementById("start").disabled = true;

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    if (!background.complete || !background.naturalWidth) {
      await new Promise((resolve, reject) => {
        background.onload = resolve;
        background.onerror = reject;
      });
    }

    document.getElementById("capture").disabled = false;

    document.getElementById("status").textContent =
      "Camera ready!";

  } catch (error) {

    document.getElementById("status").textContent =
      "Camera error: " + error.message;

    document.getElementById("start").disabled = false;

  }

};


// TAKE PHOTO

document.getElementById("capture").onclick = async () => {

  if (isCapturing) return;

  if (
    !background.complete ||
    !background.naturalWidth ||
    !video.videoWidth
  ) {
    alert("Camera or frame is not ready.");
    return;
  }

  isCapturing = true;

  const captureBtn = document.getElementById("capture");
  const status = document.getElementById("status");

  captureBtn.disabled = true;

  // COUNTDOWN

  for (let i = 3; i > 0; i--) {

    status.textContent = "Get ready... " + i;

    await new Promise(resolve =>
      setTimeout(resolve, 800)
    );

  }

  // CANVAS SIZE

  canvas.width = 1800;
  canvas.height = 1200;

  // CROP CAMERA TO FIT FULL CANVAS

  const sw = video.videoWidth;
  const sh = video.videoHeight;

  const ratio = Math.max(
    canvas.width / sw,
    canvas.height / sh
  );

  const cropW = canvas.width / ratio;
  const cropH = canvas.height / ratio;

  const sx = (sw - cropW) / 2;
  const sy = (sh - cropH) / 2;

  // LAYER 1: CAMERA PHOTO

  ctx.save();

  // Mirror camera photo
  ctx.translate(canvas.width, 0);
  ctx.scale(-1, 1);

  ctx.drawImage(
    video,
    sx, sy, cropW, cropH,
    0, 0, canvas.width, canvas.height
  );

  ctx.restore();

  // LAYER 2: TRANSPARENT CONCERT FRAME

  ctx.drawImage(
    background,
    0, 0,
    canvas.width,
    canvas.height
  );

  // FINAL PHOTO

  photoData = canvas.toDataURL("image/jpeg", 0.9);

  document.getElementById("photo").src = photoData;

  document.getElementById("cameraArea").style.display = "none";

  document.getElementById("result").style.display = "block";

  status.textContent = "Sending photo to Google Drive...";

  // SEND TO GOOGLE APPS SCRIPT

  if (!window.opener) {

    status.textContent =
      "Please open this camera from the Apps Script launcher.";

    isCapturing = false;
    return;

  }

  window.opener.postMessage({

    type: "SAVE_PHOTO",
    data: photoData,
    filename: "AlJabr_Concert_" + Date.now() + ".jpg"

  }, "*");

};


// RECEIVE UPLOAD RESULT

window.addEventListener("message", event => {

  if (event.data.type === "UPLOAD_RESULT") {

    if (event.data.success) {

      document.getElementById("qr").innerHTML = "";

      new QRCode(
        document.getElementById("qr"),
        {
          text: event.data.downloadUrl,
          width: 180,
          height: 180
        }
      );

      document.getElementById("download").href =
        event.data.downloadUrl;

      document.getElementById("status").textContent =
        "Saved! Scan your QR Code.";

    } else {

      document.getElementById("status").textContent =
        "Upload failed. Please ask the event team.";

    }

  }

});


// NEXT GUEST

document.getElementById("next").onclick = () => {

  document.getElementById("result").style.display = "none";

  document.getElementById("cameraArea").style.display = "block";

  document.getElementById("capture").disabled = false;

  document.getElementById("qr").innerHTML = "";

  document.getElementById("download").removeAttribute("href");

  document.getElementById("status").textContent =
    "Ready for the next guest!";

  isCapturing = false;

};

</script>

</body>
</html>
